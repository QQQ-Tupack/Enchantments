pack:
  format: 48
  description: "Enchantments"
  lang_locales: [uk_ua, en_us]

item_tags:
  wearable_boots: [minecraft:leather_boots, minecraft:chainmail_boots, minecraft:copper_boots, minecraft:iron_boots, minecraft:golden_boots, minecraft:diamond_boots, minecraft:netherite_boots]
  wearable_chestplates: [minecraft:leather_chestplate, minecraft:chainmail_chestplate, minecraft:copper_chestplate, minecraft:iron_chestplate, minecraft:golden_chestplate, minecraft:diamond_chestplate, minecraft:netherite_chestplate]
  totem: [minecraft:totem_of_undying]
  axes: [minecraft:wooden_axe, minecraft:stone_axe, minecraft:iron_axe, minecraft:golden_axe, minecraft:diamond_axe, minecraft:netherite_axe]
  shields: [minecraft:shield]
  fishing_rods: [minecraft:fishing_rod]
  wolf_armor: [minecraft:wolf_armor]
  horse_armor: [minecraft:leather_horse_armor, minecraft:iron_horse_armor, minecraft:golden_horse_armor, minecraft:diamond_horse_armor]

enchantments:
  double_jump:
    name: "Подвійний стрибок"
    supported_items: "#enchantments:wearable_boots"
    slots: [feet]
    weight: 3
    max_level: 3
    triggers:
      - mechanic: double_jump
        velocity_y: 0.6
        velocity_y_per_level: 0.1
        forward_mult: 0.5
        food_cost: 0.1
        min_food: 7
        safe_fall_height: 3.0
    sources:
      enchanting_table: true
      loot_tables:
        - table: minecraft:chests/end_city_treasure
          chance: 0.15
          min_level: 1
          max_level: 3
        - table: minecraft:chests/ancient_city
          chance: 0.1
          min_level: 1
          max_level: 3
        - table: minecraft:chests/trial_chambers/reward
          chance: 0.12
          min_level: 1
          max_level: 3

  kill_all_mobs:
    name: "Звіробій"
    supported_items: "#enchantments:totem"
    triggers:
      - mechanic: effect
        trigger: deal_damage
        causes: [ENTITY_ATTACK, ENTITY_SWEEP_ATTACK]
        effects:
          - { type: strength, duration: 200 }
    sources:
      enchanting_table: true
      loot_tables:
        - table: minecraft:chests/ancient_city
          chance: 0.1
          min_level: 1
          max_level: 1
        - table: minecraft:chests/pillager_outpost
          chance: 0.12
          min_level: 1
          max_level: 1

  overkill:
    name: "Понад вбивство"
    supported_items: "#enchantments:totem"
    triggers:
      - mechanic: effect
        trigger: deal_damage
        causes: [ENTITY_ATTACK, ENTITY_SWEEP_ATTACK]
        effects:
          - { type: strength, amplification: 1, duration: 200 }
    sources:
      enchanting_table: false
      loot_tables:
        - table: minecraft:chests/nether_bridge
          chance: 0.15
          min_level: 1
          max_level: 1
        - table: minecraft:chests/bastion/treasure
          chance: 0.18
          min_level: 1
          max_level: 1

  hero_of_the_village:
    name: "Герой села"
    supported_items: "#enchantments:totem"
    triggers:
      - mechanic: effect
        trigger: trade
        effects:
          - { type: hero_of_the_village, duration: 1200 }
    sources:
      enchanting_table: false
      villager_trades:
        - { profession: librarian, villager_level: 5, min_level: 1, max_level: 1, price: 45 }
      loot_tables:
        - table: minecraft:chests/village/village_weaponsmith
          chance: 0.08
          min_level: 1
          max_level: 1

  netherite_armor:
    name: "Вкрий мене уламками"
    supported_items: "#enchantments:totem"
    triggers:
      - mechanic: effect
        trigger: take_damage
        causes: [ENTITY_ATTACK, ENTITY_SWEEP_ATTACK]
        effects:
          - { type: absorption, amplification: 1, duration: 200 }
    sources:
      enchanting_table: false
      loot_tables:
        - table: minecraft:chests/bastion/treasure
          chance: 0.2
          min_level: 1
          max_level: 1
        - table: minecraft:chests/fortress_treasure
          chance: 0.15
          min_level: 1
          max_level: 1

  axe_of_kratos:
    name: "Сокира Кратоса"
    supported_items: "#enchantments:axes"
    slots: [mainhand]
    weight: 2
    max_level: 1
    triggers:
      - mechanic: axe_throw
        cooldown_ticks: 60
        max_flight_ticks: 15
        return_ticks: 20
        hunger_cost: 1
        durability_cost: 2
        damage_mult: 0.75
    sources:
      enchanting_table: false
      villager_trades:
        - { profession: weaponsmith, villager_level: 4, min_level: 1, max_level: 1, price: 40 }

  axe_pull:
    name: "Сокира збирає дари"
    supported_items: "#enchantments:axes"
    slots: [mainhand]
    weight: 2
    max_level: 1
    triggers:
      - mechanic: axe_pull
        collect_radius: 1.5
    sources:
      enchanting_table: true
      loot_tables:
        - table: minecraft:chests/abandoned_mineshaft
          chance: 0.1
          min_level: 1
          max_level: 1
        - table: minecraft:chests/pillager_outpost
          chance: 0.08
          min_level: 1
          max_level: 1

  axe_cleave:
    name: "Сокира Розшибу"
    supported_items: "#enchantments:axes"
    slots: [mainhand]
    weight: 2
    max_level: 1
    triggers:
      - mechanic: axe_cleave
        cleave_radius: 2.0
        cleave_damage: 3.0
    sources:
      enchanting_table: true
      loot_tables:
        - table: minecraft:chests/stronghold/treasure
          chance: 0.14
          min_level: 1
          max_level: 1
        - table: minecraft:chests/fortress_treasure
          chance: 0.12
          min_level: 1
          max_level: 1

  parrying:
    name: "Парирування"
    supported_items: "#enchantments:shields"
    slots: [mainhand, offhand]
    weight: 2
    max_level: 1
    triggers:
      - mechanic: parry
        window_ticks: 10
        shield_damage: 3
        counter_damage: 1.0
        counter_range: 3.0
        knockback_mult: 1.5
        knockback_min_y: 0.3
        fail_cooldown_ticks: 20
        replay_delay_step_ticks: 2
    sources:
      enchanting_table: true
      loot_tables:
        - table: minecraft:chests/end_ship_treasure
          chance: 0.15
          min_level: 1
          max_level: 1
        - table: minecraft:chests/desert_pyramid
          chance: 0.1
          min_level: 1
          max_level: 1

  parachute:
    name: "Парашут"
    supported_items: "#enchantments:wearable_chestplates"
    slots: [chest]
    weight: 3
    max_level: 1
    triggers:
      - mechanic: parachute
        duration_ticks: 100
        cooldown_ticks: 200
        fall_distance_trigger: 3.0
        descend_speed: 0.3
    sources:
      enchanting_table: true
      loot_tables:
        - table: minecraft:chests/jungle_temple
          chance: 0.12
          min_level: 1
          max_level: 1
        - table: minecraft:chests/swamp_hut
          chance: 0.1
          min_level: 1
          max_level: 1

  grappling_hook:
    name: "Гак-Кішка"
    supported_items: "minecraft:fishing_rod"
    slots: [mainhand, offhand]
    weight: 2
    max_level: 1
    triggers:
      - mechanic: grappling_hook
        pull_speed: 1.5
        launch_multiplier: 2.5
        min_entity_distance: 3.0
        wall_immunity_ticks: 60
        durability_cost: 1
    sources:
      enchanting_table: false
      loot_tables:
        - { table: minecraft:chests/village/village_weaponsmith, chance: 0.15, min_level: 1, max_level: 1 }

  wolf_companion:
    name: "Вовча душа"
    supported_items: "#enchantments:wolf_armor"
    slots: [body]
    weight: 3
    max_level: 1
    triggers:
      - mechanic: wolf_companion
        command: pet
        protect_from_owner_damage: true
        protect_from_owner_projectiles: true
        protect_suffocation: true
        protect_named_target: true
    sources:
      enchanting_table: false
      villager_trades:
        - { profession: leatherworker, villager_level: 3, min_level: 1, max_level: 1, price: 25 }

  wolf_petting:
    name: "Вовче ласкання"
    supported_items: "#enchantments:wolf_armor"
    slots: [body]
    weight: 2
    max_level: 1
    triggers:
      - mechanic: wolf_petting
        enabled: true
    sources:
      enchanting_table: true
      loot_tables:
        - table: minecraft:chests/ancient_city
          chance: 0.08
          min_level: 1
          max_level: 1

  wolf_sniff:
    name: "Вовче нюхання"
    supported_items: "#enchantments:wolf_armor"
    slots: [body]
    weight: 2
    max_level: 1
    triggers:
      - mechanic: wolf_sniff
        enabled: true
        radius: 50
        glow_ticks: 200
    sources:
      enchanting_table: true
      loot_tables:
        - table: minecraft:chests/buried_treasure
          chance: 0.12
          min_level: 1
          max_level: 1
        - table: minecraft:chests/shipwreck_treasure
          chance: 0.1
          min_level: 1
          max_level: 1

  wolf_fetch:
    name: "Вовче підбирання"
    supported_items: "#enchantments:wolf_armor"
    slots: [body]
    weight: 2
    max_level: 1
    triggers:
      - mechanic: wolf_fetch
        enabled: true
        radius: 50
        item_age_threshold: 200
        excluded_items: [WOODEN_AXE, STONE_AXE, IRON_AXE, GOLDEN_AXE, DIAMOND_AXE, NETHERITE_AXE]
    sources:
      enchanting_table: true
      loot_tables:
        - table: minecraft:chests/jungle_temple
          chance: 0.09
          min_level: 1
          max_level: 1

  horse_companion:
    name: "Вірний"
    supported_items: "#enchantments:horse_armor"
    slots: [body]
    weight: 3
    max_level: 1
    triggers:
      - mechanic: horse_companion
        command: whistle
        follow: { enabled: true, distance: 25.0 }
    sources:
      enchanting_table: false
      villager_trades:
        - { profession: leatherworker, villager_level: 3, min_level: 1, max_level: 1, price: 25 }

  # --- Ефекти пасивних аур ---

